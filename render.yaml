services:
  - type: web
    name: quantum-drug-discovery
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BCRYPT_ROUNDS
        value: 12
      - key: ALLOWED_ORIGINS
        value: https://virtual-drug-discovery.web.app,https://virtual-drug-discovery.firebaseapp.com
      - key: RENDER_EXTERNAL_URL
        value: https://quantum-drug-discovery.onrender.com
